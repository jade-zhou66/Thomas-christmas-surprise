<script>const music=document.querySelector('audio');music.volume=.55;function play(){if(music.paused)music.play().catch(()=>{});}play();document.addEventListener('WeixinJSBridgeReady',play);document.addEventListener('click',play);document.addEventListener('touchend',play,{passive:true});
const santa=document.getElementById('santa'),ball=document.getElementById('ball'),james=document.getElementById('james'),speech=document.getElementById('speech');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function dialogue(firstDuration,second,third){
  speech.textContent='';
  speech.hidden=false;
  await wait(1000);
  speech.textContent='Hi Thomas!';
  await wait(firstDuration);
  speech.textContent=second;
  await wait(3000);
  if(third){
    speech.textContent=third;
    await wait(2000);
  }
  speech.hidden=true;
}
async function scene(){
  await wait(1400);
  await dialogue(2000,'有人在找你！');
  santa.hidden=true;
  ball.hidden=false;
  await wait(5000); // Three seconds of bouncing, then two seconds at rest.
  ball.hidden=true;
  james.hidden=false;
  await wait(650);
  speech.classList.remove('left');
  await dialogue(1000,'Merry Christmas\nThomas','有一份圣诞礼物在等你。');
  james.classList.add('leaving');
  await wait(1400);
  james.hidden=true;
  const finale=document.getElementById('finale');
  finale.hidden=false;
  await wait(1000);
  finale.querySelector('.present').classList.add('shaking');
  await wait(2000);
  finale.classList.add('open');
  await wait(2400);
  document.getElementById('surprise').hidden=false;
  await wait(3000);
  finale.hidden=true;
  const seated=document.getElementById('seated');
  const bubble=document.getElementById('letterSpeech');
  seated.hidden=false;
  await wait(500);
  bubble.hidden=false;
  await wait(1000);
  bubble.textContent='我这里有你的一封信';
  await wait(2000);
  bubble.hidden=true;
  document.getElementById('letterStage').hidden=false;
  seated.style.opacity='0';
  await wait(3000);
  seated.hidden=true;
  document.getElementById('hint').classList.remove('waiting');
}
const book=document.getElementById('book'),hint=document.getElementById('hint');
async function openTree(){
  if(book.disabled)return;
  book.disabled=true;
  hint.classList.add('waiting');
  const cover=book.querySelector('img');
  const currentAngle=getComputedStyle(cover).transform;
  cover.style.transform=currentAngle;
  canvas.closest('main').classList.add('treeNight');
  canvas.hidden=false;
  resize();
  draw(performance.now());
  book.classList.add('opened');
  book.setAttribute('aria-expanded','true');
  void cover.offsetWidth;
  cover.style.removeProperty('transform');
  await wait(reduced.matches ? 0 : 750);
  document.getElementById('letterStage').hidden=true;
}
book.addEventListener('click',openTree);
hint.addEventListener('click',openTree);
window.addEventListener('load',scene,{once:true});
